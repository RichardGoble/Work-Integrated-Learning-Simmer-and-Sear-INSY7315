name: ci-cd


on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WEB_PROJECT: src/SimmerAndSear.Web/SimmerAndSear.Web.csproj

jobs:
  
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore

      
      - run: dotnet build --no-restore -c Release -warnaserror

      - name: Unit tests
        run: >
          dotnet test tests/SimmerAndSear.UnitTests --no-build -c Release
          --logger "trx;LogFileName=unit.trx"
          --collect:"XPlat Code Coverage"

      - name: Architecture tests
        run: dotnet test tests/SimmerAndSear.ArchitectureTests --no-build -c Release

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-results
          path: "**/TestResults/**"
          if-no-files-found: ignore

  integration:
    name: integration
    runs-on: ubuntu-latest
    needs: unit

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      Mongo__ConnectionString: mongodb://localhost:27017
      Mongo__Database: simmersear_ci

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore

      - run: dotnet build --no-restore -c Release -warnaserror

      - name: Integration tests
        run: >
          dotnet test tests/SimmerAndSear.IntegrationTests --no-build -c Release
          --logger "trx;LogFileName=integration.trx"


  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan history for committed secrets
        run: |
          VERSION=8.24.0
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-banner --redact --exit-code 1

  deploy:
    name: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [integration, secrets-scan]
    runs-on: ubuntu-latest

    steps:
      - name: Check Azure is configured
        id: guard
        run: |
          if [ -z "${{ vars.AZURE_WEBAPP_NAME }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AZURE_WEBAPP_NAME is not set. Skipping deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.guard.outputs.configured == 'true'

      - uses: actions/setup-dotnet@v6
        if: steps.guard.outputs.configured == 'true'
        with:
          global-json-file: global.json

      - name: Publish
        if: steps.guard.outputs.configured == 'true'
        run: dotnet publish ${{ env.WEB_PROJECT }} -c Release -o ./publish

      - name: Deploy to Azure App Service
        id: deploy
        if: steps.guard.outputs.configured == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: ./publish

  
      - name: Smoke test
        if: steps.guard.outputs.configured == 'true'
        env:
          DEPLOYED_URL: ${{ steps.deploy.outputs.webapp-url }}
          FALLBACK_HOST: ${{ vars.AZURE_WEBAPP_HOSTNAME }}
        run: |
          BASE="${DEPLOYED_URL:-}"

          if [ -z "$BASE" ] && [ -n "$FALLBACK_HOST" ]; then
            BASE="https://${FALLBACK_HOST}"
          fi

          if [ -z "$BASE" ]; then
            echo "::error::Cannot determine the deployed URL. The deploy action returned no"
            echo "::error::webapp-url output and the AZURE_WEBAPP_HOSTNAME repository variable"
            echo "::error::is not set. Set it to the app's Default domain from the Azure portal"
            echo "::error::Overview blade, without the https:// prefix."
            exit 1
          fi

          BASE="${BASE%/}"
          URL="${BASE}/health/ready"
          echo "Smoke testing ${URL}"

          for i in $(seq 1 18); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || true)
            echo "attempt $i -> $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Application is up."
              exit 0
            fi
            sleep 10
          done

          echo "::error::Smoke test failed - ${URL} never returned 200."
          echo "::error::Roll back by re-running the previous successful deploy."
          exit 1
