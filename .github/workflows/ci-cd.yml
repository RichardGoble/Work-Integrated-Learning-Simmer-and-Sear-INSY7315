name: ci-cd

# Job names here MUST match the required status checks configured in branch
# protection (unit / integration / secrets-scan), or the checks never go green
# and nothing can ever be merged.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  # A newer push supersedes an in-flight run on the same ref. Keeps the queue
  # short when several people push in the same ten minutes.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WEB_PROJECT: src/SimmerAndSear.Web/SimmerAndSear.Web.csproj

jobs:
  # ---------------------------------------------------------------- unit
  # No services, no secrets, no database. Business rules, validators, mappers
  # and the BSON conventions. Should stay under two minutes for the whole life
  # of the project.
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore

      # -warnaserror lives here rather than in Directory.Build.props: the quality
      # gate applies to everything that merges, without blocking local iteration.
      - run: dotnet build --no-restore -c Release -warnaserror

      - name: Unit tests
        run: >
          dotnet test tests/SimmerAndSear.UnitTests --no-build -c Release
          --logger "trx;LogFileName=unit.trx"
          --collect:"XPlat Code Coverage"

      - name: Architecture tests
        run: dotnet test tests/SimmerAndSear.ArchitectureTests --no-build -c Release

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: "**/TestResults/**"
          if-no-files-found: ignore

  # ---------------------------------------------------------- integration
  # A real MongoDB in a service container: real queries, real indexes, real
  # GridFS, real $jsonSchema rejections. Needs no secrets at all, which is
  # precisely why these can run on every pull request.
  integration:
    name: integration
    runs-on: ubuntu-latest
    needs: unit

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      Mongo__ConnectionString: mongodb://localhost:27017
      Mongo__Database: simmersear_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore

      - run: dotnet build --no-restore -c Release -warnaserror

      - name: Integration tests
        run: >
          dotnet test tests/SimmerAndSear.IntegrationTests --no-build -c Release
          --logger "trx;LogFileName=integration.trx"

  # --------------------------------------------------------- secrets-scan
  # Two minutes of configuration that directly evidences the secrets-handling
  # requirement, and stops a service-account key or connection string ever
  # reaching the history.
  #
  # The gitleaks BINARY, not gitleaks/gitleaks-action: the action requires a paid
  # licence key for repositories owned by a GitHub Organisation.
  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan history for committed secrets
        run: |
          VERSION=8.24.0
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-banner --redact --exit-code 1

  # ------------------------------------------------------- deploy staging
  # Skipped until AZURE_WEBAPP_NAME_STG is set as a repository variable, so the
  # pipeline is green before Azure exists and activates the moment it does.
  deploy-staging:
    name: deploy-staging
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    needs: [integration, secrets-scan]
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Check Azure is configured
        id: guard
        run: |
          if [ -z "${{ vars.AZURE_WEBAPP_NAME_STG }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AZURE_WEBAPP_NAME_STG is not set. Skipping deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.configured == 'true'

      - uses: actions/setup-dotnet@v4
        if: steps.guard.outputs.configured == 'true'
        with:
          global-json-file: global.json

      - name: Publish
        if: steps.guard.outputs.configured == 'true'
        run: dotnet publish ${{ env.WEB_PROJECT }} -c Release -o ./publish

      - name: Deploy to Azure App Service
        if: steps.guard.outputs.configured == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME_STG }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_STG }}
          package: ./publish

      # The smoke gate. A deploy step that cannot tell you whether the
      # application actually came up is not a deployment pipeline.
      - name: Smoke test
        if: steps.guard.outputs.configured == 'true'
        run: |
          URL="https://${{ vars.AZURE_WEBAPP_NAME_STG }}.azurewebsites.net/health/ready"
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL" || true)
            echo "attempt $i -> $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Staging is up."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Smoke test failed - /health/ready never returned 200."
          exit 1

  # ---------------------------------------------------- deploy production
  # Triggered by a version tag, gated by the 'production' environment so a human
  # approves the release. Promotes the same commit that passed staging.
  deploy-production:
    name: deploy-production
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [integration, secrets-scan]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check Azure is configured
        id: guard
        run: |
          if [ -z "${{ vars.AZURE_WEBAPP_NAME_PROD }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AZURE_WEBAPP_NAME_PROD is not set. Skipping deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.configured == 'true'

      - uses: actions/setup-dotnet@v4
        if: steps.guard.outputs.configured == 'true'
        with:
          global-json-file: global.json

      - name: Publish
        if: steps.guard.outputs.configured == 'true'
        run: dotnet publish ${{ env.WEB_PROJECT }} -c Release -o ./publish

      - name: Deploy to Azure App Service
        if: steps.guard.outputs.configured == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME_PROD }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_PROD }}
          package: ./publish

      - name: Smoke test
        if: steps.guard.outputs.configured == 'true'
        run: |
          URL="https://${{ vars.AZURE_WEBAPP_NAME_PROD }}.azurewebsites.net/health/ready"
          for i in $(seq 1 18); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL" || true)
            echo "attempt $i -> $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Production is up."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Smoke test failed - rolling back by redeploying the previous tag."
          exit 1
